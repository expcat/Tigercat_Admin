name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        if: matrix.suite == 'backend'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        if: matrix.suite == 'backend'
        run: dotnet restore Tigercat.Admin.sln

      - name: Run backend tests
        if: matrix.suite == 'backend'
        run: dotnet test Tigercat.Admin.sln --no-restore --configuration Release

      - name: Setup PNPM
        if: matrix.suite == 'frontend'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: matrix.suite == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        if: matrix.suite == 'frontend'
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontends
        if: matrix.suite == 'frontend'
        run: pnpm typecheck

      - name: Build frontends
        if: matrix.suite == 'frontend'
        run: pnpm build

      - name: Upload frontend dist
        if: matrix.suite == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            Tigercat.Admin.React/dist
            Tigercat.Admin.Vue/dist
          if-no-files-found: error

      - name: Build Pages static demo
        if: matrix.suite == 'frontend'
        run: pnpm build:pages

      - name: Upload Pages demo artifact
        if: matrix.suite == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: pages-demo
          path: dist/pages
          if-no-files-found: error

  e2e:
    name: E2E, links, and SQL
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore .NET dependencies
        run: dotnet restore Tigercat.Admin.sln

      - name: Install Playwright browser
        run: pnpm e2e:install

      - name: Run static demo E2E tests
        run: pnpm e2e:demo

      - name: Run E2E smoke tests
        run: pnpm e2e

      - name: Check Markdown links
        run: pnpm check:links

      - name: Generate PostgreSQL migration SQL
        run: pnpm db:script:postgres

      - name: Upload PostgreSQL migration SQL
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-sql
          path: artifacts/sql/tigercat-admin-postgres.sql
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
